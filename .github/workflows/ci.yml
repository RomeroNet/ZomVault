name: CI

on:
  push:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
          
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --configuration Release --no-restore
      
    - name: Run tests
      run: dotnet test --no-build --configuration Release

  publish-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Linux
        run: |
          dotnet publish ZomVault.Cli \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o ./publish/linux

      - name: Create archive
        run: |
          cd ./publish/linux
          zip -r ../../ZomVault-${{ github.ref_name }}-linux-x64.zip .
      
      - name: Publish Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: ./ZomVault-${{ github.ref_name }}-linux-x64.zip
  
  publish-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      
      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Windows
        run: |
          dotnet publish ZomVault.Cli `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o ./publish/win

      - name: Create archive
        run: |
          Compress-Archive `
            -Path ./publish/win/* `
            -DestinationPath ./ZomVault-${{ github.ref_name }}-win-x64.zip
          
      - name: Publish Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: win-x64
          path: ./ZomVault-${{ github.ref_name }}-win-x64.zip
  
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - publish-linux
      - publish-windows
    runs-on: ubuntu-latest
    
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: linux-x64
          path: ./release

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: win-x64
          path: ./release
      
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: ./release/*
